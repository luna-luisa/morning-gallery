name: Check pictures
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths: ["content/works.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: check-pictures
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python tools/check_images.py
      - name: Keep only the latest contact sheets, on their own branch (never on main or the website)
        run: |
          cd sheets
          git init -q -b picture-sheets
          git config user.name "Morning Gallery checks"
          git config user.email "checks@users.noreply.github.com"
          git add -A && git commit -qm "Contact sheets $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" picture-sheets
          cd .. && rm -rf sheets/.git
      - name: Save the results
        run: |
          git config user.name "Morning Gallery checks"
          git config user.email "checks@users.noreply.github.com"
          git add content/imagecheck.json
          git diff --cached --quiet || (git commit -m "Picture check $(date -u +%F)" && git pull --rebase -q && git push -q)
