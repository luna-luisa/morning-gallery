name: Check pictures
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths: ["content/works.json", "tools/build_discover.py", "tools/trim_deck.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: check-pictures
env:
  SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python tools/check_images.py
      - name: Rebuild the Swipe deck (Mondays, when asked, or when it's missing)
        if: ${{ github.event_name == 'workflow_dispatch' || hashFiles('content/discover.json') == '' || contains(github.event.head_commit.message, '[deck]') }}
        run: python tools/build_discover.py
      - name: Rebuild the Swipe deck on Mondays
        if: ${{ github.event_name == 'schedule' }}
        run: if [ "$(date -u +%u)" = "1" ]; then python tools/build_discover.py; fi
      - name: Crop paper margins and mounts off new pictures (deck and app)
        run: python tools/trim_deck.py
      - name: Keep only the latest contact sheets, in the private sheets project
        if: ${{ env.SHEETS_TOKEN != '' }}
        env:
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: |
          cd sheets
          git init -q -b main
          git config user.name "Morning Gallery checks"
          git config user.email "checks@users.noreply.github.com"
          git add -A && git commit -qm "Contact sheets $(date -u +%F)"
          git push -qf "https://x-access-token:${SHEETS_TOKEN}@github.com/luna-luisa/morning-gallery-sheets.git" main
          cd .. && rm -rf sheets/.git
      - name: Save the results
        run: |
          git config user.name "Morning Gallery checks"
          git config user.email "checks@users.noreply.github.com"
          git add content/imagecheck.json content/discover.json content/trim.json content/works.json 2>/dev/null || git add content/imagecheck.json
          git diff --cached --quiet || (git commit -m "Picture check $(date -u +%F)" && git pull --rebase -q && git push -q)
